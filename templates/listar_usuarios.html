<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Usuários e Vendedores - Império da Construção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Vendedores e Usuários Cadastrados</h2>
            <div>
                <a href="/usuarios/novo" class="btn btn-primary">+ Novo Vendedor</a>
                <a href="/" class="btn btn-outline-secondary">Voltar ao Estoque</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome Completo</th>
                            <th>Login</th>
                            <th>Cargo</th>
                            <th>Vendas</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for u in usuarios %}
                        <tr>
                            <td>#{{ u.id }}</td>
                            <td><strong>{{ u.nome }}</strong></td>
                            <td><code>{{ u.username }}</code></td>
                            <td><span class="badge bg-info text-dark">{{ u.cargo }}</span></td>
                            <td>{{ u.vendas|length }}</td>
                            <td class="text-end">
                                <a href="/usuarios/{{ u.id }}/editar" class="btn btn-sm btn-outline-primary" title="Editar Usuário">✏️</a>
                                {% if current_user.id != u.id %}
                                <form action="/usuarios/{{ u.id }}/excluir" method="POST" class="d-inline" onsubmit="return confirm('Deseja realmente excluir o usuário {{ u.nome }}?');">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary" title="Excluir Usuário">🗑️</button>
                                </form>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
