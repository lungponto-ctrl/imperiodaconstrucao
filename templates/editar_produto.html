<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto - Depósito de Construção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
    <div class="container" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Editar Produto: {{ produto.nome }}</h2>
            <a href="/" class="btn btn-outline-secondary">Voltar ao Estoque</a>
        </div>

        <div class="card shadow">
            <div class="card-body p-4">
                <form method="POST">
                    <h5 class="text-primary mb-3">Informações Principais</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome do Produto *</label>
                            <input type="text" class="form-control" id="nome" name="nome" value="{{ produto.nome }}" required>
                        </div>
                        <div class="col-md-3">
                            <label for="codigo_barras" class="form-label">Código de Barras</label>
                            <input type="text" class="form-control" id="codigo_barras" name="codigo_barras" value="{{ produto.codigo_barras or '' }}">
                        </div>
                        <div class="col-md-3">
                            <label for="sku" class="form-label">SKU / Cód. Interno</label>
                            <input type="text" class="form-control" id="sku" name="sku" value="{{ produto.sku or '' }}">
                        </div>

                        <div class="col-md-4">
                            <label for="categoria_id" class="form-label">Categoria</label>
                            <select class="form-select" id="categoria_id" name="categoria_id">
                                <option value="">Selecione...</option>
                                {% for cat in categorias %}
                                <option value="{{ cat.id }}" {% if produto.categoria_id == cat.id %}selected{% endif %}>{{ cat.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="unidade_base" class="form-label">Unid. Base *</label>
                            <input type="text" class="form-control" id="unidade_base" name="unidade_base" value="{{ produto.unidade_base }}" required>
                        </div>
                        <div class="col-md-2">
                            <label for="estoque_minimo" class="form-label">Est. Mín. *</label>
                            <input type="number" step="0.001" class="form-control" id="estoque_minimo" name="estoque_minimo" value="{{ produto.estoque_minimo }}" required>
                        </div>
                        <div class="col-md-2">
                            <label for="preco_custo" class="form-label">Custo (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="preco_custo" name="preco_custo" value="{{ produto.preco_custo }}" required>
                        </div>
                        <div class="col-md-2">
                            <label for="preco_venda_base" class="form-label">Preço Venda *</label>
                            <input type="number" step="0.01" class="form-control" id="preco_venda_base" name="preco_venda_base" value="{{ produto.preco_venda_base }}" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="/" class="btn btn-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-5">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<!-- ... restante do seu código HTML ... -->

    <!-- BLOQUEIO POR INATIVIDADE -->
    <div id="overlayBloqueio" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 99999; align-items: center; justify-content: center;">
        <div class="card shadow-lg p-4 text-center" style="width: 100%; max-width: 380px; border-radius: 12px;">
            <h3 class="text-warning mb-2">🔒 Sistema Bloqueado</h3>
            <p class="text-muted small mb-3">Inatividade detectada. Digite sua senha para continuar.</p>
            <form id="formDesbloquear" onsubmit="desbloquearSistema(event)">
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold">Operador Atual: {{ current_user.nome }}</label>
                    <input type="password" class="form-control" id="senhaDesbloqueio" placeholder="Digite sua senha" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Desbloquear</button>
            </form>
        </div>
    </div>

    <script>
        let tempoInatividade = 0;
        const TEMPO_LIMITE = 5 * 60 * 1000; // 5 minutos
        let timerId = null;

        function resetarTimer() {
            clearTimeout(timerId);
            tempoInatividade = 0;
            timerId = setTimeout(ativarBloqueio, TEMPO_LIMITE);
        }

        function ativarBloqueio() {
            document.getElementById('overlayBloqueio').style.display = 'flex';
            document.getElementById('senhaDesbloqueio').value = '';
            document.getElementById('senhaDesbloqueio').focus();
        }

        async function desbloquearSistema(event) {
            event.preventDefault();
            const senha = document.getElementById('senhaDesbloqueio').value;

            try {
                const response = await fetch('/api/desbloquear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senha: senha })
                });

                const resultado = await response.json();

                if (response.ok) {
                    document.getElementById('overlayBloqueio').style.display = 'none';
                    resetarTimer();
                } else {
                    alert('Erro: ' + resultado.mensagem);
                    document.getElementById('senhaDesbloqueio').value = '';
                    document.getElementById('senhaDesbloqueio').focus();
                }
            } catch (error) {
                alert('Erro de comunicação com o servidor.');
            }
        }

        window.onload = resetarTimer;
        window.onmousemove = resetarTimer;
        window.onkeypress = resetarTimer;
        window.onclick = resetarTimer;
        window.onscroll = resetarTimer;
    </script>
</body>
</html>

</body>
</html>
